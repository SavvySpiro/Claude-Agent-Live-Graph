[project]
name = "agentgraph"
version = "0.1.0"
description = "Live, editable graph of the Claude Code agents running on this machine and the files they edit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "agents", "visualization", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = ["flask>=2.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agentgraph = "agentgraph.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentgraph"]

[tool.setuptools.package-data]
agentgraph = ["static/*", "static/vendor/*"]
